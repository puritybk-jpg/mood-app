workflows:
  mood-app-release:
    name: Mood App Release
    max_build_duration: 60
    environment:
      flutter: 3.24.0  # <-- version fix कर दिया
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
